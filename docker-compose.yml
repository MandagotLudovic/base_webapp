services:
  db:
    image: postgres:16-alpine
    container_name: template_app_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-template_app}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-template_app}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: template_app_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db # Dans Docker, l'hôte est le nom du service
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules # Évite d'écraser les node_modules du conteneur
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: